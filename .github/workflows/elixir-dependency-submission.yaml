name: Submit Hex dependencies

# Submits every Hex package in every mix.lock, transitive packages included, to the GitHub dependency
# graph. GitHub does not read mix.lock, and Dependabot only works on packages in the graph.
# mix.lock already pins every package, so nothing is built or restored: mix.lock and mix.exs are
# read as text and no repo code runs. Only public hexpm packages are submitted, since a private
# organization package could share its name with a public one and match the wrong advisory.
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: "."
        description: The directory to search. Every mix.lock that git tracks below it is submitted, so a monorepo needs one call.
      correlator:
        type: string
        default: ""
        description: Snapshot correlator. Defaults to hex-dependency-submission-<directory>. GitHub replaces a snapshot with a later one that has the same correlator.

jobs:
  submit:
    name: Submit Hex dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write # Used to submit the dependency snapshot
    defaults:
      run:
        working-directory: ${{ inputs.directory }}
    steps:
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Submit snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ inputs.directory }}
          CORRELATOR: ${{ inputs.correlator != '' && inputs.correlator || format('hex-dependency-submission-{0}', inputs.directory) }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # git lists only tracked files, so deps/ and _build/ are not searched
          mapfile -d '' -t locks < <(git ls-files -z | { grep -zE '(^|/)mix\.lock$' || true; })
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "::error::No mix.lock found in '$DIRECTORY'"
            exit 1
          fi

          # Manifest paths are relative to the repo root, so the path of the directory is prepended
          prefix=$(git rev-parse --show-prefix)
          tmp=$(mktemp -d)
          submitted=0

          # Writes one manifest per mix.lock. Any lock that cannot be read fails the run before
          # anything is submitted: the snapshot replaces the previous one, so submitting the other
          # locks would drop the alerts of this one.
          add_manifest() {
            local lock=$1 dir location exs apps f total parsed private git_deps direct direct_count
            dir=$(dirname "$lock")
            location="$prefix$lock"

            # One entry per line: "name": {:hex, :name, "1.2.3", "hash", [:mix], [deps], "hexpm", "hash"},
            # The repo is the string after the deps list: "hexpm" for public packages, "hexpm:org" for
            # private ones. The outer hash is missing in older locks. Entries from before the repo element
            # existed end with the deps list, and are public.
            jq -Rn '
              [inputs
               | capture("^\\s*\"(?<key>[^\"]+)\":\\s*\\{:hex,\\s*:(?<name>[a-z0-9_]+),\\s*\"(?<version>[^\"]+)\"(?<rest>.*)$")
               | .repo = (.rest | capture("\\],\\s*\"(?<r>[^\"]+)\"(,\\s*\"[0-9a-fA-F]+\")?\\},?\\s*$").r // "hexpm")
               | del(.rest)]' "$lock" > "$tmp/entries.json"

            # An entry lost to a parse miss would drop its alerts. Fail instead.
            total=$(grep -cE '^[[:space:]]*"[^"]+":[[:space:]]*\{:hex,' "$lock" || true)
            parsed=$(jq length "$tmp/entries.json")
            if [ "$total" -ne "$parsed" ]; then
              echo "::error file=$location::Parsed $parsed of $total Hex entries, so the format is not understood"
              exit 1
            fi

            git_deps=$(grep -cE '^[[:space:]]*"[^"]+":[[:space:]]*\{:git,' "$lock" || true)
            private=$(jq '[.[] | select(.repo != "hexpm")] | length' "$tmp/entries.json")
            if [ "$((total - private))" -eq 0 ]; then
              echo "::notice file=$location::No public Hex packages ($private private, $git_deps git), skipped"
              return 0
            fi

            # mix.lock does not say which packages mix.exs lists. A package is direct if its app name opens
            # a dependency tuple, {:name, ..., in the mix.exs next to the lock. For an umbrella (apps_path),
            # the mix.exs of its apps count too. Other mix.exs files below the directory belong to other
            # projects, fixtures or path dependencies, and do not count. Newlines are removed first so a
            # tuple split over lines matches. The atoms are matched against the lock, so unrelated tuples
            # in mix.exs are ignored. Dependencies built by a helper function are missed and show as indirect.
            # Alerts match on name and version from the lock, so a missing mix.exs only costs the
            # direct/indirect label. Every package is then submitted as indirect.
            direct='[]'
            if [ -f "$dir/mix.exs" ]; then
              exs=("$dir/mix.exs")
              apps=$(grep -oE 'apps_path:[[:space:]]*"[^"]+"' "$dir/mix.exs" | head -n 1 | sed -E 's/.*"([^"]+)"/\1/' || true)
              if [ -n "$apps" ] && [[ "$apps" != *..* ]]; then
                for f in "$dir/$apps"/*/mix.exs; do
                  [ -f "$f" ] && exs+=("$f")
                done
              fi
              direct=$(cat "${exs[@]}" | tr '\n' ' ' | { grep -oE '\{[[:space:]]*:[a-z0-9_]+[[:space:]]*,' || true; } \
                | sed -E 's/\{[[:space:]]*:([a-z0-9_]+)[[:space:]]*,/\1/' | sort -u | jq -R . | jq -s .)
            else
              echo "::warning file=$location::No mix.exs next to the lock, so every package is submitted as indirect"
            fi
            direct_count=$(jq -n --argjson d "$direct" --slurpfile e "$tmp/entries.json" \
              '[$e[0][] | select(.repo == "hexpm" and (.key as $k | $d | index($k)))] | length')
            if [ "$direct_count" -eq 0 ] && [ -f "$dir/mix.exs" ]; then
              echo "::warning file=$location::No package in the lock is listed in mix.exs, so every package is submitted as indirect"
            fi
            echo "$location: $((total - private)) public packages ($direct_count direct), $private private and $git_deps git skipped"

            # The scope is always runtime: mix.lock does not record it.
            jq -n \
              --slurpfile entries "$tmp/entries.json" \
              --argjson direct "$direct" --arg location "$location" '
              (reduce ($entries[0][] | select(.repo == "hexpm")) as $e ({};
                .[$e.name] = {
                  package_url: "pkg:hex/\($e.name)@\($e.version | @uri)",
                  relationship: (if ($direct | index($e.key)) then "direct" else "indirect" end),
                  scope: "runtime"
                })) as $resolved
              | {($location): {
                  name: $location,
                  file: {source_location: $location},
                  resolved: $resolved
                }}' > "$tmp/manifest-$submitted.json"
            submitted=$((submitted + 1))
          }

          for lock in "${locks[@]}"; do
            add_manifest "$lock"
          done

          if [ "$submitted" -eq 0 ]; then
            echo "::error::No public Hex packages found in ${#locks[@]} mix.lock file(s), so there is nothing to submit"
            exit 1
          fi

          jq -s 'add' "$tmp"/manifest-*.json > "$tmp/manifests.json"
          jq -n \
            --slurpfile manifests "$tmp/manifests.json" \
            --arg sha "$SHA" --arg ref "$REF" --arg correlator "$CORRELATOR" --arg id "$RUN_ID" \
            --arg scanned "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              version: 0,
              sha: $sha,
              ref: $ref,
              job: {correlator: $correlator, id: $id},
              detector: {
                name: "reusable-elixir mix.lock",
                version: "1.0.0",
                url: "https://github.com/intility/reusable-elixir"
              },
              scanned: $scanned,
              manifests: $manifests[0]
            }' > "$tmp/snapshot.json"

          packages=$(jq '[.manifests[].resolved | length] | add' "$tmp/snapshot.json")
          gh api -X POST "repos/$REPO/dependency-graph/snapshots" --input "$tmp/snapshot.json" --jq '.message'
          echo "Submitted $packages packages from $submitted mix.lock file(s) with correlator $CORRELATOR"
